name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Filter coverage report
        shell: bash
        run: |
          grep -v -E "postgres|main.go" coverage.out > coverage_filtered.out

      - name: Check coverage threshold
        shell: bash
        run: |
          # Ein absolut sicherer mathematischer Parser für die Rohdaten
          COVERAGE=$(awk '
            BEGIN { total = 0; covered = 0; }
            # Überspringe die erste Zeile ("mode: set") und alle Zeilen mit postgres oder main.go
            NR > 1 && $0 !~ /postgres/ && $0 !~ /main\.go/ {
              total += $2;
              if ($3 > 0) {
                covered += $2;
              }
            }
            END {
              if (total > 0) {
                printf "%.1f", (covered / total) * 100;
              } else {
                print "0.0";
              }
            }
          ' coverage.out)

          echo "Mathematically calculated core coverage is: $COVERAGE%"

          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Code coverage is too low: $COVERAGE% (Required: 80%)"
            exit 1
          fi
          echo "Success! Core logic exceeds the threshold."

      - name: Generate HTML report
        run: go tool cover -html=coverage_filtered.out -o coverage.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: |
            coverage_filtered.out
            coverage.out
            coverage.html

      - name: Build
        run: go build -o api-server ./cmd/api

  vulnerability-scan:
    runs-on: ubuntu-latest
    needs: test 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install and Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-1.26
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: product-catalog:${{ github.sha }}
          outputs: type=docker,dest=/tmp/product-catalog.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/product-catalog.tar

  trivy-scan:
    runs-on: ubuntu-latest
    needs: docker-build 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/product-catalog.tar

      - name: Run Trivy vulnerability scanner (Table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'product-catalog:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Generate Trivy JSON Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'product-catalog:${{ github.sha }}'
          format: 'json'
          output: 'trivy-report.json'

      - name: Upload Trivy Scan JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json