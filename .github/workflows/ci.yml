name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@f92a1834906fe4e948160f973b7c09b3f543ad44 # v5.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Filter coverage report
        shell: bash
        run: |
          grep -v -E "postgres|main.go" coverage.out > coverage_filtered.out

      - name: Check coverage threshold
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage_filtered.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Filtered coverage is: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Code coverage is too low: $COVERAGE% (Required: 80%)"
            exit 1
          fi

      - name: Generate HTML report
        run: go tool cover -html=coverage_filtered.out -o coverage.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go-version }}
          path: |
            coverage_filtered.out
            coverage.out
            coverage.html

      - name: Build
        run: go build -o api-server ./cmd/api

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@f92a1834906fe4e948160f973b7c09b3f543ad44 # v5.0.0
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@2226d7cb06a077cd73e671e0009da8da55da3f05 # v6.1.1
        with:
          version: latest

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 

      - name: Download coverage artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-ubuntu-latest-1.26
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d745f0d1ea00661603598585e5898f98c813 # v6.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f92133b3151c2193d47ec5222935248c639a5c0b # v3.0.0
      - name: Build Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba538747dffad41a9ff56bd1 # v5.1.0
        with:
          context: .
          push: false
          tags: product-catalog:${{ github.sha }}